apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: notiflex-secrets
  namespace: notiflex
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/yunsoo-gitaiops-project/secrets/notiflex-valkey-addr/versions/latest"
        path: "valkey-addr"
  secretObjects:
    - secretName: notiflex-secrets
      type: Opaque
      data:
        - objectName: valkey-addr
          key: VALKEY_ADDR
